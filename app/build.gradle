plugins {
    id 'com.android.application' version '8.7.3'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

def danDanPlayAppId = providers.environmentVariable('ANON_TOOL_DANDANPLAY_APP_ID').getOrElse('').trim()
def danDanPlayAppSecret = providers.environmentVariable('ANON_TOOL_DANDANPLAY_APP_SECRET').getOrElse('').trim()
def updateGithubRepository = providers.environmentVariable('ANON_TOOL_GITHUB_REPOSITORY').getOrElse('').trim()
if (!updateGithubRepository.isEmpty() && !(updateGithubRepository ==~ '[A-Za-z0-9-]+/[A-Za-z0-9_.-]+')) {
    throw new GradleException('ANON_TOOL_GITHUB_REPOSITORY must use the owner/repository format.')
}
def releaseKeystore = providers.environmentVariable('ANON_TOOL_RELEASE_KEYSTORE').getOrElse('')
def releaseStorePassword = providers.environmentVariable('ANON_TOOL_RELEASE_STORE_PASSWORD').getOrElse('')
def releaseKeyAlias = providers.environmentVariable('ANON_TOOL_RELEASE_KEY_ALIAS').getOrElse('')
def releaseKeyPassword = providers.environmentVariable('ANON_TOOL_RELEASE_KEY_PASSWORD').getOrElse('')
def signingValues = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
if (signingValues.any { !it.isEmpty() } && signingValues.any { it.isEmpty() }) {
    throw new GradleException('Set all four ANON_TOOL_RELEASE signing variables together.')
}
if (danDanPlayAppId.isEmpty() != danDanPlayAppSecret.isEmpty()) {
    throw new GradleException('Set both ANON TOOL DanDanPlay credentials, or leave both unset.')
}
if (!danDanPlayAppId.isEmpty() && (!(danDanPlayAppId ==~ /[!-~]{1,128}/)
        || danDanPlayAppSecret.length() > 512
        || danDanPlayAppSecret.codePoints().anyMatch { int value -> Character.isISOControl(value) })) {
    throw new GradleException('The ANON TOOL DanDanPlay credentials are malformed.')
}

android {
    namespace 'com.shengjian.player'
    compileSdk 35

    buildFeatures {
        buildConfig true
        compose true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }

    defaultConfig {
        applicationId 'com.shengjian.player'
        minSdk 26
        targetSdk 35
        versionCode 61
        versionName '0.29.7'
        buildConfigField 'String', 'UPDATE_GITHUB_REPOSITORY', groovy.json.JsonOutput.toJson(updateGithubRepository)
        buildConfigField 'String', 'DANDANPLAY_APP_ID', groovy.json.JsonOutput.toJson(danDanPlayAppId)
        buildConfigField 'String', 'DANDANPLAY_APP_SECRET', groovy.json.JsonOutput.toJson(danDanPlayAppSecret)
    }

    signingConfigs {
        if (!releaseKeystore.isEmpty()) {
            distribution {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Keep the existing certificate for installs signed on the original build machine.
            signingConfig releaseKeystore.isEmpty() ? signingConfigs.debug : signingConfigs.distribution
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation files('libs/jsoup-1.21.2.jar')
    implementation files('libs/rhino-1.7.15.1.jar')
    implementation files('libs/jna-5.17.0.aar')
}
