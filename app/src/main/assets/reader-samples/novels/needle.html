<main>
  <p>零点差三分钟，收音机里飘过一阵沙沙声。海风把雨水推到玻璃上，玻璃另一边，末班电车正沿岸线往回开。</p>
  <p>澄音抬起唱针，把一张没有标签的唱片放上转盘。它是今天傍晚送来的，牛皮纸上只有一句话：请在听得见海的地方播放。</p>
  <p>她把窗开了一指宽。浪声和电车声混在一起，远处的渡轮轻轻鸣笛。</p>
  <p>她按下通话键。「晚上好。今天的第一首歌，由一位没有署名的听众送出。」</p>
  <p>唱针落下，先响起的是十几秒沉默。随后，耳机里有人数了一声「一」，又笑起来，像是还没决定要不要开始。</p>
</main>
